name: Build Status Lab downloads

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/k15-status-lab/**'
      - '.github/workflows/status-lab-downloads.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/k15-status-lab/**'
      - '.github/workflows/status-lab-downloads.yml'

permissions:
  contents: write

concurrency:
  group: status-lab-downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read provenance
        id: provenance
        shell: pwsh
        run: |
          $p = Get-Content 'extensions/k15-status-lab/provenance.json' -Raw | ConvertFrom-Json
          if ($p.sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid sourceCommit in provenance.json' }
          "source_sha=$($p.sourceCommit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source_ref=$($p.sourceRef)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "status=$($p.distributionStatus)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Status Lab win-x64
        shell: pwsh
        run: |
          dotnet publish extensions/k15-status-lab/src/Vorotex.K15.StatusLab.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -o artifacts/status-lab

      - name: Publish Lighting Lab win-x64
        shell: pwsh
        run: |
          dotnet publish extensions/k15-status-lab/src/lighting-lab/Vorotex.K15.LightingLab.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -o artifacts/lighting-lab

      - name: Assemble portable package
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.provenance.outputs.source_sha }}
          SOURCE_REF: ${{ steps.provenance.outputs.source_ref }}
          DIST_STATUS: ${{ steps.provenance.outputs.status }}
        run: |
          $package = 'artifacts/package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item 'artifacts/status-lab/*' $package -Recurse -Force
          Copy-Item 'artifacts/lighting-lab/Vorotex.K15.LightingLab.exe' $package -Force
          Copy-Item 'extensions/k15-status-lab/LICENSE.md' $package -Force
          Copy-Item 'extensions/k15-status-lab/SOURCE.md' $package -Force
          Copy-Item 'extensions/k15-status-lab/provenance.json' $package -Force
          if (Test-Path 'extensions/k15-status-lab/README-RC1.md') {
            Copy-Item 'extensions/k15-status-lab/README-RC1.md' $package -Force
          }
          if (Test-Path 'extensions/k15-status-lab/status-lab-config.example.json') {
            Copy-Item 'extensions/k15-status-lab/status-lab-config.example.json' $package -Force
          }

          @(
            'VOROTEX K15 Status Lab automated build'
            "Downstream commit: $env:GITHUB_SHA"
            "Primary source ref: $env:SOURCE_REF"
            "Primary source commit: $env:SOURCE_SHA"
            "Distribution status: $env:DIST_STATUS"
            "Built at UTC: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content -Encoding UTF8 (Join-Path $package 'BUILD-INFO.txt')

          $zip = 'VOROTEX-K15-Status-Lab-latest-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$package/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii 'VOROTEX-K15-Status-Lab-latest-win-x64.sha256'

      - name: Verify portable package
        shell: pwsh
        run: |
          $required = @(
            'artifacts/package/Vorotex.K15.StatusLab.exe',
            'artifacts/package/Vorotex.K15.LightingLab.exe',
            'artifacts/package/status-lab-config.example.toml',
            'artifacts/package/configurator/index.html',
            'artifacts/package/codex-hook-logger.ps1',
            'artifacts/package/install-codex-hooks.ps1',
            'artifacts/package/provenance.json',
            'artifacts/package/BUILD-INFO.txt',
            'VOROTEX-K15-Status-Lab-latest-win-x64.zip',
            'VOROTEX-K15-Status-Lab-latest-win-x64.sha256'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing download asset: $path" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOROTEX-K15-Status-Lab-latest-win-x64
          path: |
            VOROTEX-K15-Status-Lab-latest-win-x64.zip
            VOROTEX-K15-Status-Lab-latest-win-x64.sha256
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.provenance.outputs.source_sha }}
          DIST_STATUS: ${{ steps.provenance.outputs.status }}
        run: |
          $tag = 'status-lab-latest'
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          $notes = @(
            'Automated rolling Windows build from the curated Status Lab mirror.'
            ''
            "- Downstream commit: $env:GITHUB_SHA"
            "- Primary source commit: $env:SOURCE_SHA"
            "- Distribution status: $env:DIST_STATUS"
            '- Package contains Status Lab, Lighting Lab, TOML/configurator assets, hook helpers, provenance and build metadata.'
            ''
            'This rolling release is updated whenever accepted Status Lab source changes reach downstream main.'
          ) -join [Environment]::NewLine

          gh release view $tag --json tagName *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $tag `
              'VOROTEX-K15-Status-Lab-latest-win-x64.zip' `
              'VOROTEX-K15-Status-Lab-latest-win-x64.sha256' `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload rolling release assets' }

            gh release edit $tag `
              --target $env:GITHUB_SHA `
              --title 'VOROTEX K15 Status Lab - Latest automated build' `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update rolling release metadata' }
          } else {
            gh release create $tag `
              'VOROTEX-K15-Status-Lab-latest-win-x64.zip' `
              'VOROTEX-K15-Status-Lab-latest-win-x64.sha256' `
              --target $env:GITHUB_SHA `
              --title 'VOROTEX K15 Status Lab - Latest automated build' `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create rolling release' }
          }

      - name: Publish immutable RC1 release when first available
        if: github.event_name != 'pull_request' && hashFiles('extensions/k15-status-lab/README-RC1.md') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'status-lab-rc1'

          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'RC1 release already exists; leaving it immutable.'
            exit 0
          }

          $remote = git ls-remote origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect RC1 tag state' }

          if ($remote) {
            $remoteSha = ($remote -split '\s+')[0]
            if ($remoteSha -ne $env:GITHUB_SHA) {
              throw "RC1 tag already exists at unexpected commit $remoteSha"
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish RC1 tag' }
          }

          gh release create $tag `
            'VOROTEX-K15-Status-Lab-latest-win-x64.zip#VOROTEX K15 Status Lab RC1 (win-x64)' `
            'VOROTEX-K15-Status-Lab-latest-win-x64.sha256#SHA256' `
            --target $env:GITHUB_SHA `
            --title 'VOROTEX K15 Status Lab RC1' `
            --notes-file 'extensions/k15-status-lab/README-RC1.md'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create immutable RC1 release' }
