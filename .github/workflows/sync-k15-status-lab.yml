name: Sync K15 Status Lab

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref in KostGame/vorotex-kb-profiles-and-macros2vibecoding
        required: true
        default: main
      expected_source_sha:
        description: Optional exact source commit SHA; fail closed if the ref resolves elsewhere
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-k15-status-lab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream fork main
        uses: actions/checkout@v4
        with:
          ref: main
          path: fork
          fetch-depth: 0

      - name: Checkout primary VOROTEX repository
        uses: actions/checkout@v4
        with:
          repository: KostGame/vorotex-kb-profiles-and-macros2vibecoding
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1

      - name: Verify exact source when requested
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          EXPECTED="${{ inputs.expected_source_sha }}"
          echo "Resolved source: $SOURCE_SHA"
          if [[ -n "$EXPECTED" && "$SOURCE_SHA" != "$EXPECTED" ]]; then
            echo "Expected source $EXPECTED but ref resolved to $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Prepare sync branch
        shell: bash
        working-directory: fork
        run: |
          set -euo pipefail
          git checkout -B sync/k15-status-lab origin/main

      - name: Curated import
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/status-lab"
          DST="$GITHUB_WORKSPACE/fork/extensions/k15-status-lab"
          mkdir -p "$DST/src/configurator" "$DST/configurator"

          files=(
            ConfigToml.cs
            EventJournal.cs
            JournalStateNormalizer.cs
            K15HidLightingController.cs
            K15HidProtocol.cs
            K15RgbCanary.cs
            Program.cs
            StateReducer.cs
            StatusLabApplicationContext.cs
            StatusLabConfig.cs
            Vorotex.K15.StatusLab.csproj
            WindowsNotificationPoller.cs
            codex-hook-logger.ps1
            install-codex-hooks.ps1
          )

          for file in "${files[@]}"; do
            cp "$SRC/$file" "$DST/src/$file"
          done

          # Exact build inputs stay beside the mirrored .csproj.
          cp "$SRC/configurator/index.html" "$DST/src/configurator/index.html"
          cp "$SRC/status-lab-config.example.toml" "$DST/src/status-lab-config.example.toml"

          # Convenience copies for direct browsing/use.
          cp "$SRC/configurator/index.html" "$DST/configurator/index.html"
          cp "$SRC/status-lab-config.example.toml" "$DST/status-lab-config.example.toml"

          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          SOURCE_REF="${{ inputs.source_ref }}"

          cat > "$DST/provenance.json" <<EOF
          {
            "sourceRepository": "KostGame/vorotex-kb-profiles-and-macros2vibecoding",
            "sourcePath": "status-lab",
            "sourceRef": "$SOURCE_REF",
            "sourceCommit": "$SOURCE_SHA",
            "protocolFoundation": "luftaquila/w910-webdriver",
            "mirrorPolicy": "curated-whitelist"
          }
          EOF

          cat > "$DST/SOURCE.md" <<EOF
          # Source and lineage

          This directory is a curated downstream mirror of **VOROTEX K15 Status Lab**.

          - Primary development repository: `KostGame/vorotex-kb-profiles-and-macros2vibecoding`
          - Primary source path: `status-lab/`
          - Mirrored ref: `$SOURCE_REF`
          - Mirrored commit: `$SOURCE_SHA`
          - HID/protocol foundation: `luftaquila/w910-webdriver`

          Development happens in the primary VOROTEX repository. Do not maintain an independent implementation here.
          Changes are imported only through the whitelist in `.github/workflows/sync-k15-status-lab.yml`.
          EOF

          cat > "$DST/README.md" <<'EOF'
          # K15 Status Lab / Codex Notify

          Windows tray helper for VOROTEX K15 Pro that turns Codex lifecycle state into hardware RGB effects.

          The core UX model is deliberately simple:

          - **profile color identifies the active hardware profile**;
          - **lighting effect identifies agent state**;
          - Profile A is configured as red and Profile B as blue by default;
          - `NORMAL` restores the exact hardware baseline rather than inventing another notification state;
          - configuration is human-editable TOML;
          - the bundled offline HTML configurator edits the same configuration visually;
          - Effect Lab provides bounded physical testing of candidate effects.

          This directory is an integration mirror, not the development source of truth. See `SOURCE.md` and `provenance.json`.

          ## Build

          The mirrored project remains self-contained under `src/`:

          `dotnet publish src/Vorotex.K15.StatusLab.csproj -c Release -r win-x64`

          Root-level `status-lab-config.example.toml` and `configurator/index.html` are convenience copies of the exact assets kept beside the project in `src/`.

          ## Included

          - minimal buildable Status Lab application source;
          - Codex hook helper/install scripts;
          - annotated TOML configuration;
          - offline HTML configurator.

          ## Intentionally not mirrored

          - VOROTEX keyboard profile packages;
          - macro libraries;
          - HUD sources;
          - research fixtures and owner-canary evidence;
          - historical JSON configuration;
          - unrelated repository documentation.
          EOF

          cat > "$DST/NOTICE.md" <<'EOF'
          # Licensing note

          This repository is a fork of `luftaquila/w910-webdriver` and retains the upstream GPL-3.0 license for the upstream project.

          The mirrored K15 Status Lab originates in `KostGame/vorotex-kb-profiles-and-macros2vibecoding`, which currently has no root LICENSE file. This integration does **not** silently invent a new licensing declaration for Status Lab.

          The explicit distribution-license decision is tracked in `KostGame/vorotex-kb-profiles-and-macros2vibecoding#23` and must be resolved before the initial downstream integration is merged.
          EOF

      - name: Add downstream banner without rewriting upstream README
        shell: python
        working-directory: fork
        run: |
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          start = "<!-- KOSTGAME-DOWNSTREAM-START -->"
          end = "<!-- KOSTGAME-DOWNSTREAM-END -->"
          banner = """<!-- KOSTGAME-DOWNSTREAM-START -->
          > [!IMPORTANT]
          > **KostGame downstream fork.** This repository preserves the original W910 WebDriver and carries a curated **VOROTEX K15 Pro Codex/ChatGPT RGB Status Lab** extension under [`extensions/k15-status-lab/`](extensions/k15-status-lab/). Primary Status Lab development remains in `KostGame/vorotex-kb-profiles-and-macros2vibecoding`.
          >
          > Original project and HID/protocol foundation: **luftaquila/w910-webdriver**.
          <!-- KOSTGAME-DOWNSTREAM-END -->

          """
          if start in text and end in text:
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              text = before + banner + after.lstrip("\n")
          else:
              text = banner + text
          p.write_text(text, encoding="utf-8")

      - name: Commit and publish sync branch
        id: publish
        shell: bash
        working-directory: fork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md extensions/k15-status-lab

          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No curated Status Lab changes."
            exit 0
          fi

          git commit -m "sync(k15-status-lab): import source @ ${SOURCE_SHA:0:12}"
          git push --force-with-lease origin sync/k15-status-lab
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        working-directory: fork
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          TITLE="sync(k15-status-lab): update curated mirror"
          BODY=$(cat <<EOF
          Curated Status Lab sync from the primary VOROTEX repository.

          - Source ref: \`$SOURCE_REF\`
          - Exact source commit: \`$SOURCE_SHA\`
          - Mirror policy: explicit whitelist
          - Primary development stays in \`KostGame/vorotex-kb-profiles-and-macros2vibecoding\`

          Review this PR normally. Sync never commits directly to downstream \`main\`.
          EOF
          )

          if gh pr view sync/k15-status-lab --json number >/dev/null 2>&1; then
            gh pr edit sync/k15-status-lab --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head sync/k15-status-lab --title "$TITLE" --body "$BODY"
          fi
