name: Sync K15 Status Lab

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref in KostGame/vorotex-kb-profiles-and-macros2vibecoding
        required: true
        default: main
      expected_source_sha:
        description: Optional exact source commit SHA; fail closed if the ref resolves elsewhere
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-k15-status-lab.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-k15-status-lab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream fork main
        uses: actions/checkout@v4
        with:
          ref: main
          path: fork
          fetch-depth: 0

      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
            echo "expected=${{ inputs.expected_source_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "expected=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout primary VOROTEX repository
        uses: actions/checkout@v4
        with:
          repository: KostGame/vorotex-kb-profiles-and-macros2vibecoding
          ref: ${{ steps.source.outputs.ref }}
          path: source
          fetch-depth: 1

      - name: Verify exact source when requested
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          EXPECTED="${{ steps.source.outputs.expected }}"
          echo "Resolved source: $SOURCE_SHA"
          if [[ -n "$EXPECTED" && "$SOURCE_SHA" != "$EXPECTED" ]]; then
            echo "Expected source $EXPECTED but ref resolved to $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Prepare sync branch
        shell: bash
        working-directory: fork
        run: |
          set -euo pipefail
          git checkout -B sync/k15-status-lab origin/main

      - name: Curated import
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/status-lab"
          DST="$GITHUB_WORKSPACE/fork/extensions/k15-status-lab"
          mkdir -p "$DST/src/configurator" "$DST/src/lighting-lab" "$DST/configurator" "$DST/lighting-lab"

          files=(
            AssemblyInfo.cs
            ConfigToml.cs
            EventJournal.cs
            JournalStateNormalizer.cs
            K15HidLightingController.cs
            K15HidProtocol.cs
            K15RgbCanary.cs
            Program.cs
            StateReducer.cs
            StatusLabApplicationContext.cs
            StatusLabConfig.cs
            TrayIconFactory.cs
            Vorotex.K15.StatusLab.csproj
            WindowsNotificationPoller.cs
            codex-hook-logger.ps1
            install-codex-hooks.ps1
          )

          for file in "${files[@]}"; do
            cp "$SRC/$file" "$DST/src/$file"
          done

          lighting_files=(
            LightingLabForm.cs
            LightingLabSession.cs
            Program.cs
            README.md
            Vorotex.K15.LightingLab.csproj
          )

          for file in "${lighting_files[@]}"; do
            cp "$SRC/lighting-lab/$file" "$DST/src/lighting-lab/$file"
          done

          cp "$SRC/configurator/index.html" "$DST/src/configurator/index.html"
          cp "$SRC/status-lab-config.example.toml" "$DST/src/status-lab-config.example.toml"
          cp "$SRC/configurator/index.html" "$DST/configurator/index.html"
          cp "$SRC/status-lab-config.example.toml" "$DST/status-lab-config.example.toml"
          cp "$SRC/lighting-lab/README.md" "$DST/lighting-lab/README.md"
          cp "$SRC/LICENSE.md" "$DST/LICENSE.md"

          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          SOURCE_REF="${{ steps.source.outputs.ref }}"

          cat > "$DST/provenance.json" <<EOF
          {
            "sourceRepository": "KostGame/vorotex-kb-profiles-and-macros2vibecoding",
            "sourcePath": "status-lab",
            "sourceRef": "$SOURCE_REF",
            "sourceCommit": "$SOURCE_SHA",
            "protocolFoundation": "luftaquila/w910-webdriver",
            "mirrorPolicy": "curated-whitelist",
            "distributionStatus": "beta",
            "license": "GPL-3.0-only"
          }
          EOF

          cat > "$DST/SOURCE.md" <<EOF
          # Source and lineage

          This directory is a curated downstream mirror of VOROTEX K15 Status Lab.

          - Primary development repository: KostGame/vorotex-kb-profiles-and-macros2vibecoding
          - Primary source path: status-lab/
          - Mirrored ref: $SOURCE_REF
          - Mirrored commit: $SOURCE_SHA
          - HID/protocol foundation: luftaquila/w910-webdriver
          - Distribution status: beta / release-candidate track
          - Component license: GPL-3.0-only

          Development happens in the primary VOROTEX repository. Do not maintain an independent Status Lab implementation here.
          Source/config assets are imported only through the whitelist in .github/workflows/sync-k15-status-lab.yml.
          Downstream README/NOTICE documentation is maintained in this fork and is intentionally not regenerated by the sync job.
          EOF

      - name: Commit and publish sync branch
        id: publish
        shell: bash
        working-directory: fork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/k15-status-lab

          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No curated Status Lab changes."
            exit 0
          fi

          git commit -m "sync(k15-status-lab): import source @ ${SOURCE_SHA:0:12}"
          git push --force-with-lease origin sync/k15-status-lab
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        working-directory: fork
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          TITLE="sync(k15-status-lab): update beta / RC mirror"
          BODY=$(cat <<EOF
          Curated Status Lab sync from the primary VOROTEX repository.

          - Source ref: \`$SOURCE_REF\`
          - Exact source commit: \`$SOURCE_SHA\`
          - Distribution track: beta / release candidate
          - Mirror policy: explicit whitelist
          - Includes Status Lab + Lighting Lab
          - Primary development stays in \`KostGame/vorotex-kb-profiles-and-macros2vibecoding\`

          Review this PR normally. Sync never commits directly to downstream \`main\` and does not rewrite fork-specific README/NOTICE documentation.
          EOF
          )

          if gh pr view sync/k15-status-lab --json number >/dev/null 2>&1; then
            gh pr edit sync/k15-status-lab --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head sync/k15-status-lab --title "$TITLE" --body "$BODY"
          fi
